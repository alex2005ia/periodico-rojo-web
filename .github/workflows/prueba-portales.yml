# Prueba temporal: ¿los portales municipales responden a GitHub Actions?
# Descarga cada candidato, informa código y tamaño, y guarda las respuestas para escribir los lectores.
name: Prueba de portales
on:
  push:
    branches: [a-prueba-portales]
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar candidatos
        run: |
          mkdir -p r
          HOY=$(TZ=America/Monterrey date +%Y%m%d)
          AYER=$(TZ=America/Monterrey date -d yesterday +%Y%m%d)
          UA="PeriodicoRojo/1.0 (+https://periodico-rojo-web.pages.dev/about)"
          while read -r nombre url; do
            [ -z "$nombre" ] && continue
            url=${url//HOY/$HOY}; url=${url//AYER/$AYER}
            res=$(curl -sS -L -m 30 -A "$UA" -o "r/$nombre" -w '%{http_code} %{size_download} %{content_type} %{url_effective}' "$url" 2>&1) || true
            echo "$nombre | $url | $res" | tee -a r/_resumen.txt
            sleep 2
          done <<'LISTA'
          snn-noticias https://sanicolas.gob.mx/SITIO_OFICIAL_PC/Noticias/Noticias
          snn-licencia https://pagina.sanicolas.gob.mx/SITIO_OFICIAL_PC/Licencia/Licencia
          spgg-newsfeed https://blog.sanpedro.gob.mx/news/feed/
          spgg-newsjson https://blog.sanpedro.gob.mx/wp-json/wp/v2/news?per_page=5&_embed=wp:featuredmedia
          spgg-art https://blog.sanpedro.gob.mx/news/anuncia-san-pedro-la-28a-edicion-del-kilometro-del-juguete/
          mty-art https://www.monterrey.gob.mx/noticias/retira-monterrey-9-mil-200-toneladas-de-basura-y-escombro-del-canal-medular/
          gpe-art https://guadalupe.gob.mx/noticia/inicia-guadalupe-jugueton-navideno-2026
          gar-art https://garcia.gob.mx/generales/anuncia-manuel-guerra-cavazos-conexion-entre-garcibus-y-ecovia-para-garcia-nuevo-leon/
          LISTA
      - name: Guardar respuestas en la rama de prueba
        run: |
          rm -rf prueba && mv r prueba
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prueba && git commit -q -m "Respuestas de la prueba [skip ci]" && git push
